spring.application.name=parivahan Swea 2.0
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# A strong, secure 256-bit secret key for signing JWTs
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=86400000


# Twilio SMS Configuration
# Set these env vars to enable real SMS delivery
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.from-number=${TWILIO_FROM_NUMBER}


# Gemini AI Configuration (Ask My Vehicle)
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash-lite